[package]
name = "temple-server"
version = "0.1.0"
edition = "2021"

[dependencies]
temple-agent = { path = "../temple-agent" }
temple-protocol = { path = "../temple-protocol" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
rand = "0.8"
base64 = "0.22"
